name: 更新資料並發佈網站
on:
  schedule:
    - cron: '40 7 * * 1-5'    # 台北 15:40（台股收盤後）
    - cron: '40 23 * * 0-5'   # 台北 07:40（美股收盤後；UTC 週日=台北週一）
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 還原價量快取
        uses: actions/cache@v4
        with:
          path: updater/cache
          key: bars-cache-${{ github.run_id }}
          restore-keys: |
            bars-cache-
      - name: 抓取台美股與指數價量
        run: python updater/update_data.py --workers 4
      - name: 建置網站
        run: |
          bash site_src/rebuild.sh "$GITHUB_WORKSPACE/updater/output"
          cp site_src/hub/dist/index.standalone.html site_src/hub/dist/index.html
          rm -f site_src/hub/dist/files.json site_src/hub/dist/files_abs.json
          cat updater/output/status.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_src/hub/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
